<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3ª Copa Clandestina · Anúncio (1080×1350)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="arte.css" />
  </head>
  <body>
    <!-- Quadro 1 (1/1) · anúncio da 3ª Copa, com QR da tabela do campeonato. -->
    <div class="frame anuncio" id="anuncio">
      <header class="tf-top">
        <p class="kicker"><span class="dot" aria-hidden="true"></span>Sábado, 28 de novembro · 8h · IFBA</p>
        <span class="tag">3ª Edição</span>
      </header>

      <div class="an-hero">
        <div class="plate an-plate">
          <img src="assets/escudo.png" alt="Escudo da Clandestina Futebol Clube" />
        </div>
        <h1 class="display an-title"><span class="gold">3ª</span> Copa<br />Clandestina</h1>
        <p class="lead an-lead">
          Os <strong>6 times</strong> estão montados. Grupos, semifinais, final e 3º lugar — tudo no
          mesmo dia.
        </p>
      </div>

      <footer class="an-foot">
        <dl class="facts">
          <div><dt>Data</dt><dd>28/11/2026</dd></div>
          <div><dt>Horário</dt><dd>8h</dd></div>
          <div><dt>Local</dt><dd>Quadra Poliesportiva — IFBA</dd></div>
        </dl>
        <hr class="hairline" />
        <div class="qr-row">
          <span class="qr-chip"><img src="assets/qr-copa.png" alt="QR code da tabela da copa" /></span>
          <span class="qr-label">
            <strong>Acompanhe ao vivo</strong>
            <span>Times, tabela e placares atualizados durante os jogos.</span>
          </span>
        </div>
      </footer>
    </div>
  </body>
</html>
