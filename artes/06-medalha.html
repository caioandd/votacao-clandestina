<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3ª Copa Clandestina · Medalha (4,8 cm ⌀)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="arte.css" />
  </head>
  <body>
    <!-- =====================================================================
         Arte da medalha — disco de 4,8 cm de diâmetro, fundo branco.
         567 px = 4,8 cm a 300 dpi. Para exportar com os cantos transparentes
         (recorte), rode o shoot-app.mjs com --alpha (ver artes/README.md).
         ===================================================================== -->

    <div class="frame medalha" id="medalha">
      <p class="kicker"><span class="dot" aria-hidden="true"></span>3ª Copa Clandestina</p>

      <div class="plate medalha-plate">
        <img src="assets/escudo.png" alt="Escudo da Clandestina Futebol Clube" />
      </div>

      <h1 class="display medalha-title">Campeão</h1>
      <span class="medalha-rule" aria-hidden="true"></span>

      <p class="medalha-date">28/11/2026</p>
    </div>
  </body>
</html>
