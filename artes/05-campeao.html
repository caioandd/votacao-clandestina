<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3ª Copa Clandestina · Campeão (6,5×6,5 cm)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="arte.css" />
  </head>
  <body>
    <!-- =====================================================================
         Arte do campeão — peça de 6,5×6,5 cm para a base do troféu.
         768 px = 6,5 cm a 300 dpi (exporte também em 600 dpi: --dsf 2).
         Sem nome de time: a taça é de quem ganhar a final.
         ===================================================================== -->

    <!-- 1/2 · versão escura (identidade do site) -->
    <div class="frame campeao" id="campeao-escuro">
      <p class="kicker"><span class="dot" aria-hidden="true"></span>3ª Copa Clandestina</p>

      <div class="plate campeao-plate">
        <img src="assets/escudo.png" alt="Escudo da Clandestina Futebol Clube" />
      </div>

      <h1 class="display campeao-title">Campeão</h1>
      <span class="campeao-rule" aria-hidden="true"></span>

      <footer class="campeao-foot">
        <p class="campeao-date">28/11/2026</p>
        <p class="campeao-local">Quadra Poliesportiva — IFBA</p>
      </footer>
    </div>

    <!-- 2/2 · versão clara, para bases escuras -->
    <div class="frame campeao campeao--claro" id="campeao-claro">
      <p class="kicker"><span class="dot" aria-hidden="true"></span>3ª Copa Clandestina</p>

      <div class="plate campeao-plate">
        <img src="assets/escudo.png" alt="Escudo da Clandestina Futebol Clube" />
      </div>

      <h1 class="display campeao-title">Campeão</h1>
      <span class="campeao-rule" aria-hidden="true"></span>

      <footer class="campeao-foot">
        <p class="campeao-date">28/11/2026</p>
        <p class="campeao-local">Quadra Poliesportiva — IFBA</p>
      </footer>
    </div>
  </body>
</html>
